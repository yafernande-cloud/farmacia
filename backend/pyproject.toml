[project]
name = "farmacia-lantano-backend"
version = "0.1.0"
description = "Backend de Farmacia Parque Lantaño — Asistente Inteligente de Compras"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    # 2.1 trae `postgresql.distinct_on`, que evita el `.distinct(col, col)` ya obsoleto (búsqueda C4).
    "sqlalchemy[asyncio]>=2.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Validación de los JWT de Supabase Auth contra su JWKS (claves asimétricas).
    "PyJWT[crypto]>=2.8",
    # Lectura de las planillas .xlsx ORIGINALES de los proveedores (E8). `defusedxml` es lo que hace
    # que openpyxl no expanda entidades XML de archivos no confiables.
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    # Parseo del `multipart/form-data` del endpoint E8 (`POST /api/v1/imports`).
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: requiere PostgreSQL real (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
